server {
    listen 80;
    listen [::]:443;

    server_name _;

    root /usr/share/nginx/html;

    # version.json e index.html nunca se cachean: el cliente compara la versión para
    # recargar las pestañas abiertas tras un deploy. Van antes de cualquier cache de /assets/.
    location = /assets/version.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Bundles con hash (outputHashing: all): se pueden cachear un año.
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
