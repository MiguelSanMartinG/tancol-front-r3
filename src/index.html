<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SISTEMA TANCOL</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Aplica el modo oscuro antes de pintar (evita el parpadeo en claro).
    try {
      var t = localStorage.getItem('tancol:tema');
      if (t === 'oscuro') {
        document.documentElement.classList.add('app-dark');
      }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
