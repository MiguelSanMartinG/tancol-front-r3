@if (dialogError.display()) {
  <div class="error-notice-anchor" @fadeInOut>
    <div class="error-notice" role="alert">
      <p class="error-notice__message">{{ notice().message }}</p>
      @if (notice().detail) {
        <p class="error-notice__detail">{{ notice().detail }}</p>
      }
      @if (notice().code) {
        <p class="error-notice__code">Código {{ notice().code }}</p>
      }
      <div class="error-notice__actions">
        @if (notice().retry) {
          <button type="button" class="error-notice__retry" (click)="handleRetry()">Reintentar</button>
        }
        <button type="button" class="error-notice__close" (click)="close()">Cerrar</button>
      </div>
    </div>
  </div>
}
