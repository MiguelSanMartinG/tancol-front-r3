<div class="flex justify-end">
  <button

    class="back-btn"
    [routerLink]="[router()]"

    tooltipPosition="bottom"
    appendTo="body"
    tooltipStyleClass="tancol-tooltip"
    [attr.aria-label]="tooltip()"

    <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
  </button>
</div>
