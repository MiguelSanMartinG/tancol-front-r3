<!-- Barra delgada mientras hay peticiones; la forma del contenido la dan los esqueletos de cada pantalla. -->
@if (loadingService.loading()) {
  <div class="carga-barra" role="progressbar" aria-label="Cargando" @fadeInOut><span></span></div>
}
<!-- Al guardar se bloquean los clics (sin tapar la pantalla) para evitar dobles envíos. -->
@if (loadingService.guardando()) {
  <div class="carga-bloqueo" aria-hidden="true"></div>
}
