<p-dialog
  header=""
  [modal]="true"
  [(visible)]="display"
  [style]="{ width: '25rem' }"
>
  <ng-container *ngTemplateOutlet="appEditar"></ng-container>
</p-dialog>
<ng-template #appEditar>
  <div class="flex flex-col">
    <div class="flex justify-center pb-2">
      <div class="h-12 w-12 rounded-full border-2 border-{{color}}-400 flex justify-center items-center">
        <i class="fa-regular {{icon}} text-2xl text-{{color}}-400"></i>
        <!-- <i class="fa-solid fa-trash text-2xl text-red-400"></i> -->
      </div>
    </div>
    <div>
      <h2 class="text-2xl text-center font-bold">{{title}}</h2>
      <p class="text-center">{{description}}</p>
    </div>
  </div>
  <form class="pt-5" [formGroup]="formulario">
    <div class="pt-5">
      <p-button
        label="{{option1label}}"
        [severity]="option1Severity"
        styleClass="w-full  !py-2"
        (onClick)="option1()"
      />
      <br />
      <br />
      <p-button
        label="{{option2label}}"
        [outlined]="true"
        [severity]="option2Severity"
        styleClass="w-full  !py-2"
        (onClick)="option2()"
      />
    </div>
  </form>
</ng-template>
