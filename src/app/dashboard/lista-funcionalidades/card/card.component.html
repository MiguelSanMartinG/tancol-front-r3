<a
  [routerLink]="[route()]"
  class="p-6 bg-slate-50 border-x-2 hover:bg-gray-200 h-full w-auto justify-center align-middle rounded-2xl flex flex-col gap-5 shadow-md"
>
  <div class="flex place-content-center justify-center">
    <img [src]="icon()" [alt]="label()" class="h-24 w-24 object-contain icon-purple" />
  </div>
  <div class="place-content-center">
    <h5 class="mb-2 text-4xl text-gray-700 uppercase text-center font-bold">
      {{ label() }}
    </h5>
  </div>
</a>
