<div class="grid grid-cols-1 gap-6 sm:grid-cols-4 lg:grid-cols-4">
  @for (item of tabs; track $index) {
    <div class="cursor-pointer rounded-lg bg-activeTab p-4 text-center shadow" [ngClass]="{'bg-activeTab text-white': item.key === activeTab}" (click)="tabUpdate(item)">
      <i class="{{item.icon}}"></i> {{item.label}}
    </div>
  }
</div>

<div class="catalog-page mt-14">
  <button type="button" class="catalog-page-arrow" [disabled]="currentPage === 0" (click)="previousPage()" aria-label="Página anterior" title="Página anterior">
    <i class="pi pi-chevron-left"></i>
  </button>

  <div class="grid min-h-[34rem] flex-1 grid-cols-1 content-start gap-x-6 gap-y-7 sm:grid-cols-3 lg:grid-cols-4">
    @for (item of pageItems; track $index) {
      <div class="cursor-pointer text-center" [routerLink]="[(item.active) ? item.route : 'none']">
        <div class="mx-auto flex h-32 w-32 items-center justify-center rounded-full border-4 bg-item" [ngClass]="{ 'border-activeTab': item.active && !item.iconPending, 'bg-item': item.active && !item.iconPending, 'border-orange-400': item.iconPending, 'bg-orange-50': item.iconPending }">
          <img [src]="item.icon" [alt]="item.label" class="h-16 w-16 object-contain" [ngClass]="{ 'icon-purple': !item.iconPending, 'icon-orange': item.iconPending }" />
        </div>
        <span class="mt-2 block text-xl text-gray-800">{{ item.label }}</span>
      </div>
    }
  </div>

  <button type="button" class="catalog-page-arrow" [disabled]="currentPage >= totalPages - 1" (click)="nextPage()" aria-label="Página siguiente" title="Página siguiente">
    <i class="pi pi-chevron-right"></i>
  </button>
</div>
<p *ngIf="totalPages > 1" class="mt-3 text-center text-sm text-slate-400">Hoja {{ currentPage + 1 }} de {{ totalPages }}</p>
