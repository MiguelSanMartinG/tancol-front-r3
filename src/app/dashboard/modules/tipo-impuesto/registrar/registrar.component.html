<p-dialog
  pFocusTrap
  header="Tipo de impuesto-Crear"
  [modal]="true"
  [(visible)]="display"
  [style]="{ width: '25rem' }"
  (onHide)="handleHide()"
>
  @if(display){
  <ng-container *ngTemplateOutlet="appForm"></ng-container>
  }
</p-dialog>

<ng-template #appForm>
  <form class="pt-5" [formGroup]="formulario" (ngSubmit)="submit()">
    <div class="pt-1">
      <label class="block font-medium ">Nombre: <app-span-required/> </label>
      <input
        type="text"
        pInputText
        class="w-full"
        formControlName="nombre"
        tabindex="0"
        autofocus
      />
      <app-message-error
        [control]="formulario.get('nombre')"
      ></app-message-error>
    </div>    <div class="pt-1">
      <label class="block font-medium ">Porcentaje: <app-span-required/> </label>
      <input
        type="number"
        pInputText
        class="w-full"
        formControlName="porcentaje"
        tabindex="0"
        autofocus
      />
      <app-message-error
        [control]="formulario.get('porcentaje')"
      ></app-message-error>
    </div>
    <div class="pt-5">
      <p-button
        [disabled]="!formulario.valid"
        label="Registrar"
        type="submit"
        styleClass="w-full  !py-2"
      />
    </div>
  </form>
</ng-template>
