    <form class="grid grid-cols-12 gap-5" [formGroup]="formulario">
      <div class="col-span-6">
        <label class="block font-medium">Nombre: </label>
        <input
          type="text"
          pInputText
          class="w-full"
          placeholder="--"
          formControlName="nombre"
        />
        <app-message-error
          [control]="formulario.get('nombre')"
        ></app-message-error>
      </div>

      <div class="col-span-6">
        <label class="block font-medium">Alias: </label>
        <input
          type="text"
          pInputText
          class="w-full"
          placeholder="--"
          formControlName="alias"
        />
        <app-message-error
          [control]="formulario.get('alias')"
        ></app-message-error>
      </div>



    </form>
