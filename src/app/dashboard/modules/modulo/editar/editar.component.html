<div>
  <div>
    <app-header label="Módulo - Editar"></app-header>
  </div>
  <div class="bg-white mt-5 rounded-2xl p-5 form-card">
    <form [formGroup]="formulario" class="grid grid-cols-1 gap-4">
      <div>
        <label class="block mb-1">Nombre</label>
        <input pInputText formControlName="name" class="w-full" />
        <app-message-error [control]="formulario.get('name')"></app-message-error>
      </div>
      <div>
        <label class="block mb-1">Ruta</label>
        <input pInputText formControlName="rutaModulo" class="w-full" />
        <app-message-error [control]="formulario.get('rutaModulo')"></app-message-error>
      </div>
      <div>
        <label class="block mb-1">Módulo padre</label>
        <p-select [options]="modulosDisponibles" optionLabel="name" optionValue="idModulo" formControlName="parentId" placeholder="Seleccione uno" [filter]="true" filterPlaceholder="Buscar..." emptyFilterMessage="Sin resultados"></p-select>
      </div>
    </form>
  </div>
  <div class="form-actions">
    <app-boton-cancelar [route]="['../../']" />
    <p-button [disabled]="formulario.invalid" icon="pi pi-save" styleClass="form-save-button" label="Actualizar" severity="primary" (onClick)="validarRegistros()"></p-button>
  </div>
</div>
