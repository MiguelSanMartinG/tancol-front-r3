<app-dialog-eliminar
  [(visible)]="display"
  title="Eliminar módulo"
  message="¿Seguro que deseas eliminar este registro? Esta acción no se puede deshacer."
  confirmLabel="Eliminar"
  [details]="[{ label: 'Nombre', value: formulario.get('name')?.value }]"
  (confirm)="submit()"
  (cancel)="handleHide()"
/>
