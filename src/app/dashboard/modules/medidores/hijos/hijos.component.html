<div>
  <div>
    <app-boton-regresar router="../../" />
  </div>
  <div class="pt-10">
    <app-header [label]="'Medidores hijos de ' + (medidorPadre()?.nombre || '')"></app-header>
  </div>
  <div>
    <div class="mt-5 mb-5">
      <p-button label="Registrar" styleClass="w-full  !py-2" (onClick)="displayCreate()" />
    </div>
    <div class="grid grid-cols-12 gap-8">
      <div class="col-span-12 bg-white mt-5 rounded-2xl shadow-md p-5">
        <p-table
          #table
          [value]="listaRegistros()"
          [paginator]="true"
          selectionMode="single"
          [rows]="10"
          [tableStyle]="{ 'min-width': '50rem' }"
          [rowsPerPageOptions]="[5, 10, 20]"
          [globalFilterFields]="['idMedidor','nombre','alias','tipoAgua']"
        >
          <ng-template #caption>
            <div class="flex">
              <p-button label="Limpiar filtros" [outlined]="true" icon="pi pi-filter-slash" (click)="table.clear()" />
              <p-iconfield iconPosition="left" class="ml-auto">
                <p-inputicon>
                  <i class="pi pi-search"></i>
                </p-inputicon>
                <input pInputText type="text" (input)="searchTable(table,$event)" placeholder="Busqueda global" />
              </p-iconfield>
            </div>
          </ng-template>
          <ng-template #header>
            <tr>
              <th class="!font-bold !text-left">#</th>
              <th class="!font-bold !text-center" pSortableColumn="nombre">
                Nombre <p-sortIcon field="nombre" />
              </th>
              <th class="!font-bold !text-center" pSortableColumn="alias">
                Alias <p-sortIcon field="alias" />
              </th>
              <th class="!font-bold !text-center" pSortableColumn="tipoAgua">
                Tipo de agua <p-sortIcon field="tipoAgua" />
              </th>
              <th class="!font-bold !text-center" pSortableColumn="createdAt">
                Creado <p-sortIcon field="createdAt" />
              </th>
              <th class="!font-bold !text-center" pSortableColumn="updatedAt">
                Actualizado <p-sortIcon field="updatedAt" />
              </th>
              <th class="!font-bold !text-center">Acciones</th>
            </tr>
          </ng-template>
          <ng-template #body let-item let-i="rowIndex">
            <tr>
              <td class="!text-left">{{ i + 1 }}</td>
              <td class="!text-center">{{ item.nombre }}</td>
              <td class="!text-center">{{ item.alias }}</td>
              <td class="!text-center">{{ item.tipoAgua }}</td>
              <td class="!text-center">{{ item.createdAt | datetime }}</td>
              <td class="!text-center">{{ item.updatedAt | datetime }}</td>
              <td class="!text-center">
                <div class="flex gap-2 justify-center">
                  <p-button icon="fa-solid fa-pen" severity="info" variant="outlined" pTooltip="Editar" (onClick)="displayUpdate(item)" appendTo="body" tooltipStyleClass="tancol-tooltip" />
                  <p-button icon="fa-solid fa-book" severity="help" variant="outlined" pTooltip="Bitacora" (onClick)="displayBitacora(item)" appendTo="body" tooltipStyleClass="tancol-tooltip" />
                  <p-button icon="fa-solid fa-trash" severity="danger" variant="outlined" pTooltip="Eliminar" (onClick)="displayDelete(item)" appendTo="body" tooltipStyleClass="tancol-tooltip" />
                </div>
              </td>
            </tr>
          </ng-template>
        </p-table>
      </div>
    </div>
  </div>
</div>
<app-eliminar-medidor (deleted)="onDeleted()"></app-eliminar-medidor>
