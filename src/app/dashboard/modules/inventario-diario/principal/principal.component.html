<div class="idi-page">
  <div class="page-heading">
    <app-header label="Inventario diario de insumos"></app-header>
    <div class="idi-heading-actions">
      <div class="idi-area">
        <label for="idiArea">Área</label>
        <p-select inputId="idiArea" [options]="areasOpciones()" optionLabel="label" optionValue="value" [ngModel]="areaId()" (ngModelChange)="cambiarArea($event)" appendTo="body" styleClass="idi-area__select" [filter]="true" filterPlaceholder="Buscar..." emptyFilterMessage="Sin resultados" placeholder="Selecciona" />
      </div>
      <div class="idi-tabs" role="tablist" aria-label="Secciones del inventario diario">
        <button type="button" role="tab" [attr.aria-selected]="pestana() === 'inventario'" [class.is-active]="pestana() === 'inventario'" (click)="pestana.set('inventario')">
          <i class="pi pi-box" aria-hidden="true"></i> Inventario del día
        </button>
        <button type="button" role="tab" [attr.aria-selected]="pestana() === 'solicitudes'" [class.is-active]="pestana() === 'solicitudes'" (click)="irASolicitudes(null)">
          <i class="pi pi-send" aria-hidden="true"></i> Solicitudes de stock
        </button>
      </div>
      <app-boton-regresar router="../../" tooltip="Volver a Operación" />
    </div>
  </div>

  <!-- Los mismos filtros para Inventario del día y Solicitudes de stock -->
  <section class="idi-filters" [class.is-abierto]="masFiltros()" aria-label="Filtros">
    <div class="idi-filters__base">
      <div class="idi-filter idi-filter--range">
        <app-date-range [inicio]="inicio()" (inicioChange)="inicio.set($event)" [fin]="fin()" (finChange)="fin.set($event)" />
      </div>
      <div class="idi-filter">
        <label for="idiRuta">Ruta</label>
        <p-select inputId="idiRuta" [options]="rutasOpciones()" optionLabel="label" optionValue="value" [ngModel]="rutaId()" (ngModelChange)="rutaId.set($event)" placeholder="Todas" [showClear]="true" [filter]="true" filterBy="label" appendTo="body" styleClass="w-full" [disabled]="pestana() === 'solicitudes'" />
      </div>
      <div class="idi-filter">
        <label for="idiEmpleado">Empleado</label>
        <p-select inputId="idiEmpleado" [options]="empleadosOpciones()" optionLabel="label" optionValue="value" [ngModel]="empleadoId()" (ngModelChange)="empleadoId.set($event)" placeholder="Todos" [showClear]="true" [filter]="true" filterBy="label" appendTo="body" styleClass="w-full" />
      </div>
      <div class="idi-filters__acciones">
        <button type="button" class="idi-mas" (click)="masFiltros.set(!masFiltros())" [attr.aria-expanded]="masFiltros()" aria-controls="idiMasFiltros">
          <i class="pi pi-sliders-h" aria-hidden="true"></i>
          {{ masFiltros() ? 'Menos filtros' : 'Más filtros' }}
          @if (!masFiltros() && filtrosOcultosActivos() > 0) {
            <span class="idi-mas__n">{{ filtrosOcultosActivos() }}</span>
          }
          <i class="pi" [class.pi-chevron-down]="!masFiltros()" [class.pi-chevron-up]="masFiltros()" aria-hidden="true"></i>
        </button>
        <p-button ariaLabel="Limpiar filtros" pTooltip="Limpiar filtros" tooltipPosition="top" appendTo="body" tooltipStyleClass="tancol-tooltip" [outlined]="true" icon="pi pi-filter-slash" (onClick)="limpiarFiltros()" />
      </div>
    </div>
    @if (masFiltros()) {
      <div class="idi-filters__mas" id="idiMasFiltros">
        <div class="idi-filter">
          <label for="idiInsumo">Insumo</label>
          <p-select inputId="idiInsumo" [options]="insumosOpciones()" optionLabel="label" optionValue="value" [ngModel]="insumoId()" (ngModelChange)="insumoId.set($event)" placeholder="Todos" [showClear]="true" [filter]="true" filterBy="label" appendTo="body" styleClass="w-full" />
        </div>
        <div class="idi-filter">
          <label for="idiRotoPor">Roto por</label>
          <p-select inputId="idiRotoPor" [options]="rotoPorOpciones()" optionLabel="label" optionValue="value" [ngModel]="rotoPor()" (ngModelChange)="rotoPor.set($event)" placeholder="Todos" [showClear]="true" [filter]="true" filterBy="label" appendTo="body" styleClass="w-full" [disabled]="pestana() === 'solicitudes'" />
        </div>
        @if (pestana() === 'inventario') {
        <div class="idi-filter">
          <label for="idiFirmado">Firmado</label>
          <p-select inputId="idiFirmado" [options]="firmadoOpciones" optionLabel="label" optionValue="value" [ngModel]="firmado()" (ngModelChange)="firmado.set($event)" placeholder="Todos" [showClear]="true" appendTo="body" styleClass="w-full" />
        </div>
        }
      </div>
    }
  </section>

  @if (areaId(); as area) {
    @if (pestana() === 'inventario') {
      <app-inventario-dia [enfocarInsumo]="insumoEnfocado()" [areaId]="area" [empleadoId]="empleadoId()" [inicio]="inicio()" [fin]="fin()" [(insumoFiltro)]="insumoId" [rutaId]="rutaId()" [rotoPor]="rotoPor()" [(firmado)]="firmado" (verSolicitudes)="irASolicitudes($event)" />
    } @else {
      <app-solicitudes-stock (irATarjeta)="irATarjeta($event)" [resaltar]="folioResaltado()" [areaId]="area" [empleadoId]="empleadoId()" [inicio]="inicio()" [fin]="fin()" [insumoId]="insumoId()" />
    }
  }
</div>
