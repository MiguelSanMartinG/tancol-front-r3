<div class="catalog-page">
  <div class="catalog-heading">
    <app-header label="Ordenes de compra"></app-header>
    <app-boton-regresar router="../../" />
  </div>
  <div class="catalog-table">
    <tc-native-table
      storageKey="ordenes-compra-v1"
      [columns]="columns"
      [rows]="page.rows()"
      [total]="page.total()"
      [loading]="page.loading()"
      [pageSize]="page.pageSize()"
      [sort]="page.sort()"
      [filters]="page.filters()"
      [selectedIndex]="page.selectedIndex()"
      [rowHeight]="52"
      (sortChange)="page.onSort($event)"
      (filtersChange)="page.onFilters($event)"
      (pageSizeChange)="page.onPageSize($event)"
      (visibleRangeChange)="page.onVisibleRange($event)"
      (selectedIndexChange)="page.selectedIndex.set($event)"
    >
      <div tcNativeTableToolbar>
        <p-button label="Importar" [outlined]="true" severity="success" icon="pi pi-upload" (onClick)="importFile.display = true" />
        <p-button label="Exportar" [outlined]="true" severity="warn" icon="pi pi-download" (click)="exportar()" />
        @if (selectedIds().length > 0) {
          <p-button label="Eliminar" [outlined]="true" severity="danger" icon="fa-solid fa-trash" (click)="modalEliminarTodo.onDisplay(selectedIds().length)" />
        }
        <p-button label="Limpiar filtros" [outlined]="true" icon="pi pi-filter-slash" (click)="page.clearQuery()" />
        <p-iconfield iconPosition="left">
          <p-inputicon><i class="pi pi-search"></i></p-inputicon>
          <input pInputText type="text" [value]="page.searchDraft" (input)="page.onSearch($any($event.target).value)" placeholder="Búsqueda global" />
        </p-iconfield>
      </div>
      <ng-template tcNativeTableCell="index" let-index="index"><span class="cell-text">{{ index + 1 }}</span></ng-template>
      <ng-template tcNativeTableCell="seleccion" let-row>
        <input type="checkbox" [checked]="isSelected(row.idSolicitud)" (click)="$event.stopPropagation()" (change)="toggle(row.idSolicitud, $any($event.target).checked)" />
      </ng-template>
      <ng-template tcNativeTableCell="folio" let-row><span class="cell-text">{{ row.folio }}</span></ng-template>
      <ng-template tcNativeTableCell="proveedor" let-row><span class="cell-text">{{ row.proveedor?.nombreComercial }}</span></ng-template>
      <ng-template tcNativeTableCell="folioExterno" let-row><span class="cell-text">{{ row.folioExterno }}</span></ng-template>
      <ng-template tcNativeTableCell="totalOrden" let-row><span class="cell-text">{{ row.totalOrden | formartNumber }}</span></ng-template>
      <ng-template tcNativeTableCell="prioridad" let-row>
        <div class="flex justify-center items-center"><app-badge-prioridad-orden [value]="row.prioridad"></app-badge-prioridad-orden></div>
      </ng-template>
      <ng-template tcNativeTableCell="fechaSolicitud" let-row><span class="cell-text">{{ row.createdAt | datetime }}</span></ng-template>
      <ng-template tcNativeTableCell="fechaModificacion" let-row><span class="cell-text">{{ row.updatedAt | datetime }}</span></ng-template>
      <ng-template tcNativeTableCell="estatusFactura" let-row>
        <div class="flex justify-center items-center"><app-badge-status-orden [value]="row.estatusFactura ?? ''"></app-badge-status-orden></div>
      </ng-template>
      <ng-template tcNativeTableCell="fechaFacturacion" let-row><span class="cell-text">{{ row.fechaFacturacion | datetime }}</span></ng-template>
      <ng-template tcNativeTableCell="acciones" let-row>
        <p-select #accionSelect [options]="acciones" optionLabel="label" optionValue="value" placeholder="Acciones" class="w-full" appendTo="body" (onChange)="ejecutarAccion(row, $event.value); accionSelect.writeValue(null)" />
      </ng-template>
      <ng-template tcNativeTableEmpty>Sin ordenes de compra</ng-template>
    </tc-native-table>
  </div>
</div>
<app-eliminar></app-eliminar>
<app-import-file #importFile [service]="solicitudCompraApiService" [configuration]="configurationImport" (imported)="page.resetAndLoad()"></app-import-file>
<app-dialog-eliminar-todo #modalEliminarTodo (accept)="deleteAll()"></app-dialog-eliminar-todo>
