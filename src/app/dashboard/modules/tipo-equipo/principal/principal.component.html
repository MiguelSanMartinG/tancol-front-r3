<div>
  <app-boton-regresar router="../../" />
  <div class="pt-10">
    <app-header label="Tipos de equipo"></app-header>
  </div>

  <div class="mb-5 mt-5">
    <p-button label="Registrar" styleClass="w-full !py-2" (onClick)="crear()" />
  </div>

  <div class="grid grid-cols-12 gap-8">
    <div class="col-span-12 mt-5 rounded-2xl bg-white p-5 shadow-md">
      <p-table
        #table
        [value]="listaRegistros()"
        [paginator]="true"
        [rows]="10"
        [rowsPerPageOptions]="[5, 10, 20]"
        [tableStyle]="{ 'min-width': '50rem' }"
        [globalFilterFields]="['id', 'nombre', 'alias', 'createdAtDate', 'updatedAtDate']"
      >
        <ng-template #caption>
          <div class="flex justify-between gap-4">
            <p-button label="Limpiar filtros" [outlined]="true" icon="pi pi-filter-slash" (onClick)="table.clear()" />
            <p-iconfield iconPosition="left">
              <p-inputicon><i class="pi pi-search"></i></p-inputicon>
              <input pInputText type="text" (input)="buscar(table, $event)" placeholder="Búsqueda global" />
            </p-iconfield>
          </div>
        </ng-template>
        <ng-template #header>
          <tr>
            <th class="!font-bold !text-left">ID</th>
            <th class="!font-bold !text-center" pSortableColumn="nombre">Nombre <p-sortIcon field="nombre" /></th>
            <th class="!font-bold !text-center" pSortableColumn="alias">Alias <p-sortIcon field="alias" /></th>
            <th class="!font-bold !text-center" pSortableColumn="createdAtDate">Creado <p-sortIcon field="createdAtDate" /></th>
            <th class="!font-bold !text-center" pSortableColumn="updatedAtDate">Actualizado <p-sortIcon field="updatedAtDate" /></th>
            <th class="!font-bold !text-center">Acciones</th>
          </tr>
        </ng-template>
        <ng-template #body let-item let-i="rowIndex">
          <tr>
            <td>{{ i + 1 }}</td>
            <td class="!text-center">{{ item.nombre }}</td>
            <td class="!text-center">{{ item.alias }}</td>
            <td class="!text-center">{{ item.createdAtDate | datetime }}</td>
            <td class="!text-center">{{ item.updatedAtDate | datetime }}</td>
            <td class="!text-center">
              <div class="flex justify-center gap-2">
                <p-button icon="fa-solid fa-pen" severity="info" variant="outlined" pTooltip="Editar" (onClick)="editar(item)" />
                <p-button icon="fa-solid fa-trash" severity="danger" variant="outlined" pTooltip="Eliminar" (onClick)="eliminar(item)" />
              </div>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>

<app-tipo-equipo-eliminar></app-tipo-equipo-eliminar>
