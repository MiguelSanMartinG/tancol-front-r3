<div>
  <div class="pt-10"><app-header label="Tipo de equipo - Crear"></app-header></div>
  <div class="mt-5 rounded-2xl bg-white p-5 shadow-md">
    <h2 class="pb-5 text-xl">Información general</h2>
    <form class="grid grid-cols-12 gap-5" [formGroup]="formulario">
      <div class="col-span-6">
        <label class="block font-medium">Nombre:</label>
        <input pInputText formControlName="nombre" class="w-full" />
        <app-message-error [control]="formulario.get('nombre')" />
      </div>
      <div class="col-span-6">
        <label class="block font-medium">Alias:</label>
        <input pInputText formControlName="alias" class="w-full" />
        <app-message-error [control]="formulario.get('alias')" />
      </div>
    </form>
  </div>
  <div class="flex justify-center gap-5 pt-10">
    <p-button label="Regresar" severity="secondary" styleClass="!text-2xl !w-96" [routerLink]="['../']" />
    <p-button label="Guardar" severity="primary" styleClass="!text-2xl !w-96" (onClick)="guardar()" />
  </div>
</div>
