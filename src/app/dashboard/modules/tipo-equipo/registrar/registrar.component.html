<div>
  <div><app-header label="Tipo de equipo - Crear"></app-header></div>
  <div class="mt-5 rounded-2xl bg-white p-5 form-card">
    <h2 class="pb-5 text-xl">Información general</h2>
    <form class="grid grid-cols-12 form-grid" [formGroup]="formulario">
      <div class="col-span-6">
        <label class="block font-medium">Nombre:</label>
        <input pInputText formControlName="nombre" class="w-full" />
        <app-message-error [control]="formulario.get('nombre')" />
      </div>
      <div class="col-span-6">
        <label class="block font-medium">Alias:</label>
        <input pInputText formControlName="alias" class="w-full" />
        <app-message-error [control]="formulario.get('alias')" />
      </div>
    </form>
  </div>
  <div class="form-actions">
    <app-boton-cancelar [route]="['../']" />
    <p-button [disabled]="formulario.invalid" icon="pi pi-save" styleClass="form-save-button" label="Guardar" severity="primary" (onClick)="guardar()" />
  </div>
</div>
