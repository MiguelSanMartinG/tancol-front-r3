<app-dialog-eliminar
  [(visible)]="display"
  title="Eliminar tipo de equipo"
  message="¿Seguro que deseas eliminar este registro? Esta acción no se puede deshacer."
  confirmLabel="Eliminar"
  [details]="[{ label: 'Nombre', value: formulario.get('nombre')?.value }, { label: 'Alias', value: formulario.get('alias')?.value }]"
  (confirm)="confirmar()"
  (cancel)="cerrar()"
/>
