<p-dialog
  header=""
  [modal]="true"
  [(visible)]="display"
  [style]="{ width: '25rem' }"
  (onHide)="handleHide()"
>
  <ng-container *ngTemplateOutlet="appEditar"></ng-container>
</p-dialog>
<ng-template #appEditar>
  <div class="flex flex-col">
    <div class="flex justify-center pb-2">
      <div class="h-12 w-12 rounded-full border-2 border-orange-400 flex justify-center items-center">
        <i class="fa-regular fa-floppy-disk text-2xl text-orange-400"></i>
        <!-- <i class="fa-solid fa-trash text-2xl text-red-400"></i> -->
      </div>
    </div>
    <div>
      <h2 class="text-2xl text-center font-bold">
        Deseas actualizar el precio en lista del Producto "{{productName}}" de {{originalPrice}} a {{newPrice}}
      </h2>
      <p class="text-center">Esta actualización afectará los cálculos del sistema</p>
    </div>
  </div>
  <form class="pt-5" [formGroup]="formulario">
    <div class="pt-5">
      <p-button
        label="Confirmar actualización"
        severity="primary"
        styleClass="w-full  !py-2"
        (onClick)="confirm()"
      />
      <br />
      <br />
      <p-button
        label="Cerrar"
        [outlined]="true"
        severity="danger"
        styleClass="w-full  !py-2"
        (onClick)="cancel()"
      />
    </div>
  </form>
</ng-template>
