<div>
  <div>
    <app-boton-regresar router="../../" />
  </div>
  <div class="pt-10">
    <app-header label="Roles de empleados-Roles de empleados"></app-header>
  </div>
  <div class="mt-5 mb-5">
    <p-button label="Registrar" styleClass="w-full  !py-2" (onClick)="displayCreate()" />
  </div>
  <div class="grid grid-cols-12 gap-8">
    <div class="col-span-12 bg-white mt-5 rounded-2xl shadow-md p-5">
      <p-table #table [value]="listaRegistros()" [paginator]="true" [rows]="10" [tableStyle]="{ 'min-width': '50rem' }" [rowsPerPageOptions]="[5,10,20]" [globalFilterFields]="['name']">
        <ng-template #caption>
          <div class="flex">
            <p-button label="Limpiar filtros" [outlined]="true" icon="pi pi-filter-slash" (click)="table.clear()" />
            <p-iconfield iconPosition="left" class="ml-auto">
              <p-inputicon>
                <i class="pi pi-search"></i>
              </p-inputicon>
              <input pInputText type="text" (input)="searchTable(table,$event)" placeholder="Búsqueda global" />
            </p-iconfield>
          </div>
        </ng-template>
        <ng-template #header>
          <tr>
            <th class="!font-bold !text-left">ID</th>
            <th class="!font-bold !text-center" pSortableColumn="name">Nombre <p-sortIcon field="name" /></th>
            <th class="!font-bold !text-center">Acciones</th>
          </tr>
        </ng-template>
        <ng-template #body let-item let-i="rowIndex">
          <tr>
            <td class="!text-left">{{ i + 1 }}</td>
            <td class="!text-center">{{ item.name }}</td>
            <td class="!text-center">
              <div class="flex gap-2 justify-center">
                <p-button icon="fa-solid fa-pen" severity="info" variant="outlined" pTooltip="Editar" (onClick)="displayUpdate(item)" appendTo="body" tooltipStyleClass="tancol-tooltip" />
                <p-button icon="fa-solid fa-key" severity="help" variant="outlined" pTooltip="Permisos" (onClick)="displayPermissions(item)" appendTo="body" tooltipStyleClass="tancol-tooltip" />
                <p-button icon="fa-solid fa-trash" severity="danger" variant="outlined" pTooltip="Eliminar" (onClick)="displayDelete(item)" appendTo="body" tooltipStyleClass="tancol-tooltip" />
              </div>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>
<app-rol-eliminar></app-rol-eliminar>
