<app-dialog-eliminar
  [(visible)]="display"
  title="Eliminar rol"
  message="¿Seguro que deseas eliminar este registro? Esta acción no se puede deshacer."
  confirmLabel="Eliminar"
  [details]="[{ label: 'Nombre del rol', value: formulario.get('roleName')?.value }]"
  (confirm)="submit()"
  (cancel)="handleHide()"
/>
