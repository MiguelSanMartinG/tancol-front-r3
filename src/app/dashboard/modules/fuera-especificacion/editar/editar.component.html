<div>
  <div>
    <app-header label="Fuera de especificación - Editar"></app-header>
  </div>

  <div class="bg-white mt-5 rounded-2xl p-5 form-card">
    <h2 class="text-xl pb-5">Información general</h2>
    <form class="grid grid-cols-12 form-grid" [formGroup]="formulario">
      <div class="col-span-12">
        <label class="block font-medium">Motivo: </label>
        <input type="text" pInputText class="w-full" formControlName="motivo" />
        <app-message-error [control]="formulario.get('motivo')"></app-message-error>
      </div>
    </form>
  </div>

  <div class="form-actions">
    <app-boton-cancelar [route]="['../../']" />
    <p-button [disabled]="formulario.invalid" icon="pi pi-save" styleClass="form-save-button" label="Actualizar" severity="primary" (onClick)="validarRegistros()"></p-button>
  </div>
</div>
