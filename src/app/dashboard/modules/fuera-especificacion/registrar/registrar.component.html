<div>
  <div class="pt-10">
    <app-header label="Fuera de especificación-Crear"></app-header>
  </div>

  <div class="bg-white mt-5 rounded-2xl shadow-md p-5">
    <h2 class="text-xl pb-5">Información general</h2>
    <form class="grid grid-cols-12 gap-5" [formGroup]="formulario">
      <div class="col-span-12">
        <label class="block font-medium">Motivo: </label>
        <input
          type="text"
          pInputText
          class="w-full"
          placeholder="--"
          formControlName="motivo"
        />
        <app-message-error [control]="formulario.get('motivo')"></app-message-error>
      </div>
      <!-- <div class="col-span-6">
        <label class="block font-medium">Tipo Rezago: </label>
        <input
          type="text"
          pInputText
          class="w-full"
          placeholder="--"
          formControlName="tipoRezago"
        />
        <app-message-error [control]="formulario.get('tipoRezago')"></app-message-error>
      </div> -->
    </form>
  </div>

  <div class="pt-10 flex justify-center pr-5 gap-5">
    <p-button label="Regresar" severity="secondary" styleClass="!text-2xl !w-96" [routerLink]="['../']"></p-button>
    <p-button label="Guardar" severity="primary" styleClass="!text-2xl !w-96" (onClick)="validarRegistros()"></p-button>
  </div>
</div>
