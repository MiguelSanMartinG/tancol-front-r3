<app-dialog-eliminar
  [(visible)]="display"
  title="Eliminar concepto fuera de especificación"
  message="¿Seguro que deseas eliminar este registro? Esta acción no se puede deshacer."
  confirmLabel="Eliminar"
  [details]="[{ label: 'Motivo', value: formulario.get('motivo')?.value }, { label: 'Tipo Rezago', value: formulario.get('tipoRezago')?.value }]"
  (confirm)="submit()"
  (cancel)="handleHide()"
/>
