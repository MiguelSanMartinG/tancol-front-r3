<p-dialog
  pFocusTrap
  header="Almacén-Crear"
  [modal]="true"
  [(visible)]="display"
  [draggable]="false"
  [style]="{ width: '25rem' }"
  (onHide)="handleHide()"
>
  @if(display){
  <ng-container *ngTemplateOutlet="appForm"></ng-container>
  }
</p-dialog>

<ng-template #appForm>
  <form class="pt-5" [formGroup]="formulario" (ngSubmit)="submit()">
    <div class="pt-1">
      <label class="block font-medium">Nombre: <app-span-required/></label>
      <input
        type="email"
        pInputText
        class="w-full"
        formControlName="nombre"
        tabindex="0"
        autofocus
      />
      <app-message-error
        [control]="formulario.get('nombre')"
      ></app-message-error>
    </div>
    <div class="pt-1">
      <label class="block font-medium" for="almResponsable">Responsable: </label>
      <p-select inputId="almResponsable" formControlName="idResponsable" [options]="responsables()" optionLabel="label" optionValue="value" placeholder="Sin responsable" [showClear]="true" [filter]="true" filterBy="label" filterPlaceholder="Buscar..." emptyFilterMessage="Sin resultados" appendTo="body" styleClass="w-full" />
    </div>
    <div class="pt-5">
      <p-button
        [disabled]="!formulario.valid"
        label="Registrar"
        type="submit"
        styleClass="w-full  !py-2"
      />
    </div>
  </form>
</ng-template>
