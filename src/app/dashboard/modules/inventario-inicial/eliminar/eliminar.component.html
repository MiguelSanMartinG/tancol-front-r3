<app-dialog-eliminar
  [(visible)]="display"
  title="Eliminar inventario inicial"
  message="¿Seguro que deseas eliminar este registro? Esta acción no se puede deshacer."
  confirmLabel="Eliminar"
  [details]="[{ label: 'Almacén', value: formulario.get('nombre')?.value }, { label: 'Producto', value: formulario.get('producto')?.value }, { label: 'Cantidad', value: formulario.get('cantidad')?.value }]"
  (confirm)="submit()"
  (cancel)="handleHide()"
/>
