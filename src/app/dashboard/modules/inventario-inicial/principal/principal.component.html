<div class="catalog-page">
  <div class="catalog-heading">
    <app-header label="Inventario inicial"></app-header>
    <app-boton-regresar router="../../" tooltip="Volver a Configuración" />
  </div>
  <div class="catalog-table">
    <tc-native-table
      storageKey="inventario-inicial-v1"
      [columns]="columns"
      [rows]="page.rows()"
      [total]="page.total()"
      [loading]="page.loading()"
      [pageSize]="page.pageSize()"
      [sort]="page.sort()"
      [filters]="page.filters()"
      [selectedIndex]="page.selectedIndex()"
      (sortChange)="page.onSort($event)"
      (filtersChange)="page.onFilters($event)"
      (pageSizeChange)="page.onPageSize($event)"
      (visibleRangeChange)="page.onVisibleRange($event)"
      (selectedIndexChange)="page.selectedIndex.set($event)"
    >
      <div tcNativeTableToolbar>
        <p-button label="Registrar" icon="pi pi-plus" (onClick)="displayCreate()" />
        <p-button label="Importar" [outlined]="true" severity="success" icon="pi pi-upload" (onClick)="importFile.display = true" />
        <p-button label="Exportar" [outlined]="true" severity="warn" icon="pi pi-download" (onClick)="exportar()" />
        <p-button ariaLabel="Limpiar filtros" pTooltip="Limpiar filtros" tooltipPosition="top" appendTo="body" tooltipStyleClass="tancol-tooltip" [outlined]="true" icon="pi pi-filter-slash" (click)="page.clearQuery()" />
        <p-iconfield iconPosition="left">
          <p-inputicon><i class="pi pi-search"></i></p-inputicon>
          <input pInputText type="text" [value]="page.searchDraft" (input)="page.onSearch($any($event.target).value)" placeholder="Buscar en tabla" />
        </p-iconfield>
      </div>
      <ng-template tcNativeTableCell="index" let-index="index"><span class="cell-text">{{ index + 1 }}</span></ng-template>
      <ng-template tcNativeTableCell="almacen" let-row><span class="cell-text">{{ row.almacen?.nombre }}</span></ng-template>
      <ng-template tcNativeTableCell="producto" let-row><span class="cell-text">{{ row.producto?.nombre }}</span></ng-template>
      <ng-template tcNativeTableCell="cantidad" let-row><span class="cell-text">{{ row.cantidad }}</span></ng-template>
      <ng-template tcNativeTableCell="unidadesMedida" let-row><span class="cell-text">{{ row.unidadesMedida?.nombre }}</span></ng-template>
      <ng-template tcNativeTableCell="createdAt" let-row><span class="cell-text">{{ row.createdAt | datetime }}</span></ng-template>
      <ng-template tcNativeTableCell="updatedAt" let-row><span class="cell-text">{{ (row.updatedAt || row.createdAt) | datetime }}</span></ng-template>
      <ng-template tcNativeTableCell="acciones" let-row>
        <div class="flex gap-2 justify-center">
          <p-button icon="fa-solid fa-trash" severity="danger" variant="outlined" pTooltip="Eliminar" appendTo="body" tooltipStyleClass="tancol-tooltip" (onClick)="displayDelete(row)" />
        </div>
      </ng-template>
      <ng-template tcNativeTableEmpty>Sin inventario inicial</ng-template>
    </tc-native-table>
  </div>
</div>
<app-import-file #importFile [service]="almacenApiService" [configuration]="configurationImport" (imported)="reload()"></app-import-file>
<app-eliminar></app-eliminar>
