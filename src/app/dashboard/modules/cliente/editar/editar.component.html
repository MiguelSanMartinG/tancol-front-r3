<div>
  <!-- <div>
    <app-boton-regresar router="../principal" />
  </div> -->
  <div class="page-heading">
    <app-header [label]="readonly ? 'Cliente - Detalle' : 'Cliente - Editar'"></app-header>
    @if (readonly) {
      <app-boton-regresar router="../../" tooltip="Regresar" />
    }
  </div>

  <div class="bg-white mt-5 rounded-2xl p-5 form-card">
    <!-- <h2 class="text-xl pb-5">Información general</h2> -->
    <app-form
      [formulario]="formulario"
      [readonly]="readonly"
      [nombreComercialAnterior]="nombreComercialAnterior"
      [razonSocialAnterior]="razonSocialAnterior"
    ></app-form>
  </div>

  @if (!readonly) {
    <div class="form-actions">
      <app-boton-cancelar [route]="['../../']" />
      <!-- <p-button label="Borrado" severity="secondary" styleClass="!text-2xl !w-96"  (onClick)="submit('BORRADOR')"></p-button> -->
      <p-button icon="pi pi-save" styleClass="form-save-button" label="Actualizar" severity="primary" [disabled]="(readonly) || formulario.invalid" (onClick)="validarRegistros()"></p-button>
    </div>
  }
</div>
