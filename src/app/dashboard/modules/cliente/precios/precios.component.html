<div>
  <div class="pt-10">
    <app-header label="Precios"></app-header>
  </div>

  <p-tabs value="1" class="mt-5 block">
    <p-tablist>
      <p-tab value="0" (click)="goToClientes()">Clientes</p-tab>
      <p-tab value="1">Precios</p-tab>
    </p-tablist>
  </p-tabs>

  <div class="mt-5 grid gap-5">
    <section class="rounded-2xl bg-white p-5 shadow-md">
      <h2 class="mb-4 text-lg font-bold">Filtrar clientes</h2>
      <div class="grid gap-4 md:grid-cols-2">
        <div>
          <label class="mb-1 block font-medium">Ruta</label>
          <p-multiSelect
            [options]="rutas"
            [ngModel]="rutasSeleccionadas()"
            (ngModelChange)="rutasSeleccionadas.set($event)"
            optionLabel="label"
            optionValue="value"
            placeholder="Todas las rutas"
            class="w-full"
            appendTo="body"
            [filter]="true"
          />
        </div>
        <div>
          <label class="mb-1 block font-medium">Tipo de cliente</label>
          <p-multiSelect
            [options]="tiposCliente"
            [ngModel]="tiposClienteSeleccionados()"
            (ngModelChange)="tiposClienteSeleccionados.set($event)"
            optionLabel="label"
            optionValue="value"
            placeholder="Todos los tipos"
            class="w-full"
            appendTo="body"
            [filter]="true"
          />
        </div>
      </div>
    </section>

    <div class="grid gap-5 md:grid-cols-2">
      <section class="rounded-2xl bg-white p-5 shadow-md">
        <label class="mb-2 block text-lg font-bold">Clientes</label>
        <p-multiSelect
          [options]="clientesFiltrados()"
          [ngModel]="clientesSeleccionados()"
          (ngModelChange)="actualizarClientesSeleccionados($event)"
          optionLabel="label"
          optionValue="value"
          placeholder="Selecciona clientes"
          class="w-full"
          appendTo="body"
          [filter]="true"
          filterPlaceholder="Buscar cliente..."
          [virtualScroll]="true"
          [virtualScrollItemSize]="38"
        />
      </section>

      <section class="rounded-2xl bg-white p-5 shadow-md">
        <label class="mb-2 block text-lg font-bold">Productos</label>
        <p-multiSelect
            [options]="productos()"
          [ngModel]="productosSeleccionados()"
          (ngModelChange)="actualizarProductosSeleccionados($event)"
          optionLabel="label"
          optionValue="value"
          placeholder="Selecciona productos"
          class="w-full"
          appendTo="body"
          [filter]="true"
          filterPlaceholder="Buscar producto..."
          [virtualScroll]="true"
          [virtualScrollItemSize]="38"
        />
      </section>
    </div>

    <section class="overflow-hidden rounded-2xl bg-white p-4 shadow-md" *ngIf="productosSeleccionadosLista().length">
      <table class="w-full table-fixed text-sm">
        <colgroup>
          <col class="w-1/2" />
          <col class="w-1/5" />
          <col class="w-1/5" />
          <col class="w-16" />
        </colgroup>
        <thead>
          <tr class="bg-slate-50 text-slate-700">
            <th class="px-4 py-3 text-left font-semibold">Producto</th>
            <th class="px-4 py-3 text-center font-semibold">Precio original</th>
            <th class="px-4 py-3 text-center font-semibold">Precio cliente</th>
            <th class="px-2 py-3"></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let producto of productosSeleccionadosLista()" class="border-b border-slate-200 last:border-b-0 hover:bg-slate-50">
            <td class="truncate px-4 py-3 font-medium text-slate-700">{{ producto.label }}</td>
            <td class="px-4 py-3 text-center">
              <div class="money-input">
                <span class="money-prefix">$</span>
                <input pInputText [value]="producto.precio" readonly class="money-field" />
              </div>
            </td>
            <td class="px-4 py-3 text-center">
              <div class="money-input">
                <span class="money-prefix">$</span>
                <input
                  pInputText
                  type="number"
                  min="0"
                  [ngModel]="preciosCliente()[producto.value]"
                  (ngModelChange)="actualizarPrecioCliente(producto.value, $event)"
                  class="money-field"
                />
              </div>
            </td>
            <td class="px-2 py-3 text-center">
              <button pButton type="button" icon="pi pi-times" severity="danger" class="!h-9 !w-9" (click)="eliminarProducto(producto.value)"></button>
            </td>
          </tr>
        </tbody>
      </table>
    </section>

    <div class="flex justify-end" *ngIf="productosSeleccionadosLista().length">
      <p-button
        label="Guardar asignación"
        icon="pi pi-save"
        [loading]="guardando()"
        [disabled]="!clientesSeleccionados().length"
        (onClick)="guardarAsignacion()"
      />
    </div>
  </div>
</div>
