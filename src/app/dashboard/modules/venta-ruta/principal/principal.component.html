<div class="catalog-page">
  <div class="catalog-heading">
    <app-header label="Bitácora de ventas"></app-header>
    <app-boton-regresar router="../../" tooltip="Volver a Operación" />
  </div>

  <form [formGroup]="filtroFechas" class="catalog-filters">
    <div class="catalog-filters__field">
      <label for="vrFechaInicio">Fecha inicio</label>
      <p-datepicker inputId="vrFechaInicio" formControlName="fechaInicio" dateFormat="yy/mm/dd" [showTime]="false" [locale]="esLocale" appendTo="body" styleClass="w-full" />
    </div>
    <div class="catalog-filters__field">
      <label for="vrFechaFin">Fecha fin</label>
      <p-datepicker inputId="vrFechaFin" formControlName="fechaFin" dateFormat="yy/mm/dd" [showTime]="false" [locale]="esLocale" appendTo="body" styleClass="w-full" />
    </div>
    <div class="catalog-filters__actions">
      <p-button label="Filtrar" icon="pi pi-filter" (onClick)="filtrarPorFechas()" />
    </div>
  </form>

  <div class="catalog-table">
    <tc-native-table
      storageKey="venta-ruta-v1"
      [columns]="columns"
      [rows]="page.rows()"
      [total]="page.total()"
      [loading]="page.loading()"
      [pageSize]="page.pageSize()"
      [sort]="page.sort()"
      [filters]="page.filters()"
      [selectedIndex]="page.selectedIndex()"
      (sortChange)="page.onSort($event)"
      (filtersChange)="page.onFilters($event)"
      (pageSizeChange)="page.onPageSize($event)"
      (visibleRangeChange)="page.onVisibleRange($event)"
      (selectedIndexChange)="page.selectedIndex.set($event)"
    >
      <div tcNativeTableToolbar>
        <p-button label="Continuar" icon="pi pi-plus" (onClick)="displayCreate()" />
        <p-button label="Limpiar filtros" [outlined]="true" icon="pi pi-filter-slash" (click)="limpiarFiltros()" />
        <p-iconfield iconPosition="left">
          <p-inputicon><i class="pi pi-search"></i></p-inputicon>
          <input pInputText type="text" [value]="page.searchDraft" (input)="page.onSearch($any($event.target).value)" placeholder="Búsqueda global" />
        </p-iconfield>
      </div>
      <ng-template tcNativeTableCell="folio" let-row><span class="cell-text">{{ row.folio ?? '-' }}</span></ng-template>
      <ng-template tcNativeTableCell="fecha" let-row><span class="cell-text">{{ row.fecha ? (row.fecha | date: 'yyyy-MM-dd') : '-' }}</span></ng-template>
      <ng-template tcNativeTableCell="partidas" let-row><span class="cell-text">{{ row.bitacoraPartidaVentas?.length }}</span></ng-template>
      <ng-template tcNativeTableCell="createdAt" let-row><span class="cell-text">{{ row.createdAt ? (row.createdAt | datetime) : '-' }}</span></ng-template>
      <ng-template tcNativeTableCell="updatedAt" let-row><span class="cell-text">{{ row.updatedAt ? (row.updatedAt | datetime) : '-' }}</span></ng-template>
      <ng-template tcNativeTableCell="acciones" let-row>
        <div class="flex gap-2 justify-center">
          <p-button icon="fa-solid fa-eye" severity="info" variant="outlined" pTooltip="Ver" appendTo="body" tooltipStyleClass="tancol-tooltip" (onClick)="displayUpdate(row)" />
        </div>
      </ng-template>
      <ng-template tcNativeTableEmpty>Sin bitácoras de ventas</ng-template>
    </tc-native-table>
  </div>
</div>
