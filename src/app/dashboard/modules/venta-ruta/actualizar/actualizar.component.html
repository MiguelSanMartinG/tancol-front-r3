<div>
  <div class="page-heading">
    <app-header [label]="readonly ? 'Bitácora de ventas - Detalle' : 'Bitácora de ventas - Editar'"></app-header>
    <app-boton-regresar router="../../principal" tooltip="Regresar" />
  </div>
  <div class="bg-white mt-5 rounded-2xl p-5 form-card">
    <app-form [formulario]="formulario" [listaPartidas]="listaPartidas" [readonly]="readonly"></app-form>
  </div>

  <div *ngIf="!readonly" class="form-actions">
    <app-boton-cancelar [route]="['../../']" />
    <p-button label="Borrador / Guardar" severity="secondary" (onClick)="guardarBorrador()"></p-button>
    <p-button label="Finalizar" severity="primary" (onClick)="guardar()"></p-button>
  </div>

  <p-toast />
</div>
