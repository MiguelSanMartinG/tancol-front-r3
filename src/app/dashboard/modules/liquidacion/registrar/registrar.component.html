<div>
  <app-boton-regresar router="../principal" />
  <div>
    <app-header label="Liquidación - Crear"></app-header>
  </div>
  <div class="bg-white mt-5 rounded-2xl p-5 form-card">
    <app-liquidacion-form
      #liquidacionForm
      [formulario]="formulario"
      [listaPartidas]="listaPartidas"
      [listadoChoferes]="listadoChoferes"
    ></app-liquidacion-form>
  </div>

  <div class="form-actions">
    <app-boton-cancelar [route]="['../']" />
    <!-- <p-button
      label="Guardar"
      severity="secondary"
      styleClass="!text-2xl !w-96"
      (onClick)="guardar()"
    ></p-button> -->
    <p-button icon="pi pi-save" styleClass="form-save-button"
      label="Guardar"
      severity="secondary"
      (onClick)="borrador()"
    ></p-button>
    <p-button
      label="Liquidar"
      severity="primary"
      (onClick)="guardar()"
    ></p-button>
  </div>

  <p-toast />
  <app-dialog-confirm #dialogConfirm (dialogEvent)="confirmarLiquidacion()"></app-dialog-confirm>
</div>
