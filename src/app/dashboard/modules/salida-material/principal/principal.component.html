<div>
  <div>
    <app-boton-regresar router="../../" />
  </div>
  <div class="pt-10">
    <app-header label="Salida de material"></app-header>
  </div>
  <div class="">
    <div class="mt-5 mb-5">
      <p-button
        label="Registrar"
        styleClass="w-full  !py-2"
        (onClick)="displayCreate()"
      />
    </div>
    <div class="grid grid-cols-12 gap-8">
      <div class="col-span-12 bg-white mt-5 rounded-2xl shadow-md p-5">
        <p-table
          #table
          [value]="listaRegistros()"
          [paginator]="true"
          selectionMode="single"
          [rows]="10"
          [tableStyle]="{ 'min-width': '50rem' }"
          [rowsPerPageOptions]="[5, 10, 20]"
          [globalFilterFields]="['status','nombre','createdAt']"
        >

        <ng-template #caption>
          <div class="flex">
              <p-button label="Limpiar filtros" [outlined]="true" icon="pi pi-filter-slash" (click)="table.clear()" />
              <p-iconfield iconPosition="left" class="ml-auto">
                  <p-inputicon>
                      <i class="pi pi-search"></i>
                  </p-inputicon>
                  <input pInputText type="text" (input)="searchTable(table,$event)" placeholder="Búsqueda global" />
              </p-iconfield>
          </div>
      </ng-template>
          <ng-template #header>
            <tr>
                            <th class="!font-bold !text-center" pSortableColumn="nombre">
                Solicitud <p-sortIcon field="nombre" />
                <p-columnFilter
                type="text"
                field="nombre"
                display="menu"
              ></p-columnFilter>
              </th>
              <th class="!font-bold !text-center" pSortableColumn="nombre">
                Entregado por <p-sortIcon field="nombre" />
                <p-columnFilter
                type="text"
                field="nombre"
                display="menu"
              ></p-columnFilter>
              </th>

              <th class="!font-bold !text-center" pSortableColumn="createdAt">
                Entregado el <p-sortIcon field="createdAt" />
                <p-columnFilter type="date" field="createdAt" display="menu" />
              </th>
              <th class="!font-bold !text-center" pSortableColumn="createdAt">
                Entregado a <p-sortIcon field="createdAt" />
                <p-columnFilter type="date" field="updatedAt" display="menu" />
              </th>
              <th class="!font-bold !text-center" pSortableColumn="status">
                Estado <p-sortIcon field="status" />
                <p-columnFilter
                type="boolean"
                field="status"
                display="menu"
              ></p-columnFilter>
              </th>
              <th class="!font-bold !text-center">Acciones</th>
            </tr>
          </ng-template>
          <ng-template #body let-item let-i="rowIndex">
            <tr>
              <td class="!text-center">{{ item.folio }}</td>
              <td class="!text-center">{{ item.empleadoEmisor.nombre }}</td>
              <td class="!text-center">{{ item.createdAt | datetime }}</td>
              <td class="!text-center">{{ item.empleadoReceptor.nombre }}</td>
              <td class="!text-center">{{ item.estado }}</td>
              <td class="!text-center">
                <div class="flex gap-2 justify-center">
                  <p-button
                    icon="fa-solid fa-eye"
                    severity="info"
                    variant="outlined"
                    pTooltip="Ver"
                    appendTo="body"
                    tooltipStyleClass="tancol-tooltip"
                    (onClick)="displayUpdate(item)"
                  />
                  <!-- <p-button
                    icon="fa-solid fa-trash"
                    severity="danger"
                    variant="outlined"
                    pTooltip="Eliminar"
                    appendTo="body"
                    tooltipStyleClass="tancol-tooltip"
                    (onClick)="displayDelete(item)"
                  /> -->
                </div>
              </td>
            </tr>
          </ng-template>
        </p-table>
      </div>
    </div>
  </div>
</div>

<app-editar></app-editar>
<app-eliminar></app-eliminar> -->
