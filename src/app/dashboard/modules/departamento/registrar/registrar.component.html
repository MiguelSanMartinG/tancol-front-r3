<div>
  <!-- <div>
    <app-boton-regresar router="../principal" />
  </div> -->
  <div>
    <app-header label="Departamento - Crear"></app-header>
  </div>

  <div class="bg-white mt-5 rounded-2xl p-5 form-card">
    <h2 class="text-xl pb-5">Información general</h2>
    <form class="grid grid-cols-12 form-grid" [formGroup]="formulario">
      <div class="col-span-6">
        <label class="block font-medium">Nombre: </label>
        <input
          type="text"
          pInputText
          class="w-full"
          placeholder="--"
          formControlName="nombre"
        />
        <app-message-error
          [control]="formulario.get('nombre')"
        ></app-message-error>
      </div>

      <div class="col-span-6">
        <label class="block font-medium">Alias: </label>
        <input
          type="text"
          pInputText
          class="w-full"
          placeholder="--"
          formControlName="alias"
        />
        <app-message-error
          [control]="formulario.get('alias')"
        ></app-message-error>
      </div>

      
      <div class="col-span-12">
        <label class="block font-medium">Descripción: </label>
        <input
          type="text"
          pInputText
          class="w-full"
          placeholder="--"
          formControlName="desc"
        />
        <app-message-error
          [control]="formulario.get('desc')"
        ></app-message-error>
      </div>



    </form>
  </div>

  <div class="form-actions">
    <app-boton-cancelar [route]="['../']" />
    <!-- <p-button label="Borrado" severity="secondary" styleClass="!text-2xl !w-96"  (onClick)="submit('BORRADOR')"></p-button> -->
    <p-button [disabled]="formulario.invalid" icon="pi pi-save" styleClass="form-save-button" label="Guardar" severity="primary" (onClick)="validarRegistros()"></p-button>
  </div>
</div>
