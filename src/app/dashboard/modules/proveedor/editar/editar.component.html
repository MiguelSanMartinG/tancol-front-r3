  <div class="pt-10">
    <app-header label="Proveedor-Editar"></app-header>
  </div>

  <form class=" " [formGroup]="formulario">
    <div class="grid grid-cols-12 gap-5  bg-white mt-5 rounded-2xl shadow-md p-5">
      <h2 class="col-span-12 text-xl pb-5">Información general</h2>

      <div class="col-span-4">
        <label class="block font-medium">Nombre comercial<app-span-required /> </label>
        <input
          type="text"
          pInputText
          class="w-full"
          placeholder="--"
          formControlName="nombreComercial"
        />
        <app-message-error
          [control]="formulario.get('nombreComercial')"
        ></app-message-error>
      </div>



      <div class="col-span-4">
        <label class="block font-medium"
          >Tipo de proveedor <app-span-required />
        </label>
        <div class="w-full flex gap-3">
          <p-multiSelect
            [options]="tipoProveedorApiService.listAll()"
            formControlName="idsTipoProveedor"
            optionLabel="nombre"
            optionValue="id"
            [filter]="true"
            placeholder="Selecciona uno o más tipos"
            selectedItemsLabel="{0} tipos seleccionados"
            appendTo="body"
            emptyMessage="No se encontraron resultados"
            class="w-full"
          />
        </div>
        <app-message-error
          [control]="formulario.get('idsTipoProveedor')"
        ></app-message-error>
      </div>

      <div class="col-span-4">
        <label class="block font-medium"
          >Condiciones de pago <app-span-required />
        </label>
        <div class="w-full flex gap-3">
          <p-select
            [options]="condicionPago"
            formControlName="condicionPago"
            optionLabel="name"
            optionValue="code"
            [filter]="true"
            placeholder="Selecciona"
            emptyMessage="No se encontraron resultados"
            class="w-full"
          />
        </div>
        <app-message-error
          [control]="formulario.get('condicionPago')"
        ></app-message-error>
      </div>

      <div class="col-span-6">
        <label class="block font-medium">Correo<app-span-required /> </label>
        <input
          type="text"
          pInputText
          class="w-full"
          placeholder="--"
          formControlName="correo"
        />
        <app-message-error
          [control]="formulario.get('correo')"
        ></app-message-error>
      </div>

      <div class="col-span-6">
        <label class="block font-medium">Teléfono<app-span-required /> </label>
        <input
          type="text"
          pInputText
          class="w-full"
          placeholder="--"
          formControlName="telefono"
        />
        <app-message-error
          [control]="formulario.get('telefono')"
        ></app-message-error>
      </div>
    </div>
