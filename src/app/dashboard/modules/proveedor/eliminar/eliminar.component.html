<app-dialog-eliminar
  [(visible)]="display"
  title="Eliminar proveedor"
  message="¿Seguro que deseas eliminar este registro? Esta acción no se puede deshacer."
  confirmLabel="Eliminar"
  [details]="[{ label: 'Nombre Comercial', value: formulario.get('nombreComercial')?.value }]"
  (confirm)="submit()"
  (cancel)="handleHide()"
/>
