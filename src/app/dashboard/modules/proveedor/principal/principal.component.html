<div class="proveedor-page">
  <div class="proveedor-heading">
    <app-header label="Proveedores"></app-header>
    <app-boton-regresar router="../../" />
  </div>
  <div class="proveedor-table">
        <tc-native-table
          storageKey="proveedores-v1"
          [columns]="columns()"
          [rows]="rows()"
          [total]="total()"
          [loading]="loading()"
          [pageSize]="pageSize()"
          [sort]="sort()"
          [filters]="filters()"
          [selectedIndex]="selectedIndex()"
          (sortChange)="onSort($event)"
          (filtersChange)="onFilters($event)"
          (pageSizeChange)="onPageSize($event)"
          (visibleRangeChange)="onVisibleRange($event)"
          (selectedIndexChange)="selectedIndex.set($event)"
        >
          <div tcNativeTableToolbar>
            <p-button label="Registrar" icon="pi pi-plus" (onClick)="displayCreate()" />
            <p-button label="Limpiar filtros" [outlined]="true" icon="pi pi-filter-slash" (click)="clearQuery()" />
            <p-button label="Importar" (onClick)="importFile.display = true" [outlined]="true" severity="success" icon="pi pi-upload" />
            <p-iconfield iconPosition="left">
              <p-inputicon>
                <i class="pi pi-search"></i>
              </p-inputicon>
              <input pInputText type="text" [value]="searchDraft" (input)="onSearch($any($event.target).value)" placeholder="Búsqueda global" />
            </p-iconfield>
          </div>
          <ng-template tcNativeTableCell="index" let-index="index">
            <span class="cell-text">{{ index + 1 }}</span>
          </ng-template>
          <ng-template tcNativeTableCell="razonSocial" let-row>
            <span class="cell-text">{{ row.infoFiscal?.razonSocial }}</span>
          </ng-template>
          <ng-template tcNativeTableCell="rfc" let-row>
            <span class="cell-text">{{ row.infoFiscal?.rfc }}</span>
          </ng-template>
          <ng-template tcNativeTableCell="idTipoProveedor" let-row>
            <span class="cell-text">{{ nombresTiposProveedor(row) }}</span>
          </ng-template>
          <ng-template tcNativeTableCell="tipoContribuyente" let-row>
            <span class="cell-text">{{ contribuyenteLabel(row.infoFiscal?.tipoContribuyente) }}</span>
          </ng-template>
          <ng-template tcNativeTableCell="createdAt" let-row>
            <span class="cell-text">{{ row.createdAt | datetime }}</span>
          </ng-template>
          <ng-template tcNativeTableCell="updatedAt" let-row>
            <span class="cell-text">{{ row.updatedAt | datetime }}</span>
          </ng-template>
          <ng-template tcNativeTableCell="acciones" let-row>
            <div class="flex gap-2 justify-center">
              <p-button
                icon="fa-solid fa-pen"
                severity="info"
                variant="outlined"
                pTooltip="Editar"
                appendTo="body"
                tooltipStyleClass="tancol-tooltip"
                (onClick)="displayUpdate(row)"
              />
              <p-button
                icon="fa-solid fa-trash"
                severity="danger"
                variant="outlined"
                pTooltip="Eliminar"
                appendTo="body"
                tooltipStyleClass="tancol-tooltip"
                (onClick)="displayDelete(row)"
              />
            </div>
          </ng-template>
          <ng-template tcNativeTableEmpty>Sin proveedores</ng-template>
        </tc-native-table>
  </div>
</div>
<!-- <app-registrar-proveedor></app-registrar-proveedor>
<app-editar></app-editar> -->
<app-eliminar (deleted)="resetAndLoad()"></app-eliminar>
    <app-import-file
    #importFile
    [service]="proveedorApiService"
    [configuration]="configurationImport"
    (imported)="resetAndLoad()"
  ></app-import-file>
