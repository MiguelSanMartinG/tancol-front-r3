<div>
  <app-boton-regresar router="../../" tooltip="Volver a Rutas" />
  <div class="pt-10"><app-header label="Metas de venta por ruta"></app-header></div>

  <div class="mt-6 rounded-2xl bg-white p-5 shadow-md">
    <div class="grid gap-4 md:grid-cols-4">
      <div>
        <label class="mb-1 block font-medium">Ruta</label>
        <input *ngIf="rutaFijaId" pInputText [value]="rutaSeleccionada()" readonly class="w-full" />
        <p-select *ngIf="!rutaFijaId" [(ngModel)]="rutaId" (ngModelChange)="productoId = ''" [options]="rutas()" optionLabel="etiqueta" optionValue="id" placeholder="Selecciona ruta" class="w-full" />
      </div>
      <div>
        <label class="mb-1 block font-medium">Periodo</label>
        <input pInputText value="Semanal" readonly class="w-full" />
      </div>
      <div>
        <label class="mb-1 block font-medium">Producto Tancol</label>
        <p-select [(ngModel)]="productoId" [options]="productosDisponibles()" optionLabel="nombre" optionValue="idProductoComercial" placeholder="Selecciona producto" class="w-full" />
      </div>
      <div>
        <label class="mb-1 block font-medium">Unidad de medida</label>
        <input pInputText [value]="unidadProductoSeleccionado()" readonly class="w-full" />
      </div>
    </div>
    <div class="mt-5 grid items-end gap-4 md:grid-cols-[minmax(0,1fr)_auto]">
      <div>
        <label class="mb-1 block font-semibold">Venta mínima</label>
        <p-inputnumber inputId="cantidadMinima" [(ngModel)]="cantidadMinima" [min]="0" [step]="1" [minFractionDigits]="0" [maxFractionDigits]="0" mode="decimal" [useGrouping]="false" placeholder="Cantidad entera" styleClass="w-full" inputStyleClass="!h-10 w-full !text-lg" />
      </div>
      <div class="flex gap-2">
        <p-button [label]="editando() ? 'Actualizar' : 'Crear'" (onClick)="guardar()" styleClass="!h-10 !px-6" />
        <p-button *ngIf="editando()" label="Cancelar" severity="secondary" [outlined]="true" (onClick)="limpiar()" />
      </div>
    </div>
  </div>

  <div class="mt-6 rounded-2xl bg-white p-5 shadow-md">
    <div class="mb-4 flex items-center justify-between">
      <h2 class="text-lg font-semibold">Metas registradas</h2>
    </div>
    <p-table [value]="metas()" [paginator]="true" [rows]="20" responsiveLayout="scroll">
      <ng-template pTemplate="header"><tr><th>Ruta</th><th>Producto</th><th>Mínimo</th><th>Periodo</th><th>Estado</th><th>Acciones</th></tr></ng-template>
      <ng-template pTemplate="body" let-meta>
        <tr>
          <td>{{ etiquetaMetaRuta(meta) }}</td>
          <td>{{ meta.productoAlias || meta.productoNombre || meta.productoId }}</td>
          <td>{{ meta.cantidadMinima }}</td>
          <td>{{ meta.periodo }}</td>
          <td>{{ meta.activa ? 'Activa' : 'Cerrada' }}</td>
          <td>
            <div class="flex min-h-9 items-center gap-2">
              <ng-container *ngIf="meta.activa; else metaCerrada">
                <p-button icon="fa-solid fa-pen" [outlined]="true" pTooltip="Editar meta" appendTo="body" tooltipStyleClass="tancol-tooltip" (onClick)="editar(meta)" />
                <p-button icon="fa-solid fa-lock" severity="warn" [outlined]="true" pTooltip="Cerrar meta" appendTo="body" tooltipStyleClass="tancol-tooltip" (onClick)="cerrar(meta)" />
              </ng-container>
              <ng-template #metaCerrada><span class="text-slate-400">—</span></ng-template>
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage"><tr><td colspan="6" class="py-8 text-center">No hay metas.</td></tr></ng-template>
    </p-table>
  </div>

</div>
