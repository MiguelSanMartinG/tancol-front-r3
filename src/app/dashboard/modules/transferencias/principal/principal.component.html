<div>
    <div>
      <app-boton-regresar router="../../" />
    </div>
    <div class="pt-10">
      <app-header label="Transferencias"></app-header>
    </div>
    <div class="">
      <div class="mt-5 mb-5">
        <p-button
          label="Registrar"
          styleClass="w-full  !py-2"
          (onClick)="displayCreate()"
        />
      </div>
      <div class="grid grid-cols-12 gap-8">
        <div class="col-span-12 bg-white mt-5 rounded-2xl shadow-md p-5">
          <p-table
            #table
            [value]="listaRegistros()"
            [paginator]="true"
            selectionMode="single"
            [rows]="10"
            [tableStyle]="{ 'min-width': '50rem' }"
            [rowsPerPageOptions]="[5, 10, 20]"
[globalFilterFields]="['nombreComercial', 'razonSocial', 'tipoClienteNombre', 'telefono', 'fechaAlta', 'createdAt', 'updatedAt']"
            
          >
  
<ng-template pTemplate="caption">
            <div class="flex">
                <p-button label="Limpiar filtros" [outlined]="true" icon="pi pi-filter-slash" (click)="table.clear()" />
                <p-iconfield iconPosition="left" class="ml-auto">
                    <p-inputicon>
                        <i class="pi pi-search"></i>
                    </p-inputicon>
                    <input pInputText type="text" (input)="searchTable(table,$event)" placeholder="Búsqueda global" />
                </p-iconfield>
            </div>
        </ng-template>
            <ng-template #header>
              <tr>
                <th class="!font-bold !text-left">Solicitud</th>
                <th class="!font-bold !text-center" pSortableColumn="nombreComercial">
                  Almacén base<p-sortIcon field="nombreComercial" />
                  <p-columnFilter
                  type="text"
                  field="nombreComercial"
                  display="menu"
                ></p-columnFilter>
                </th>
                <th class="!font-bold !text-center" pSortableColumn="razonSocial">
                  Almacén destino <p-sortIcon field="razonSocial" />
                  <p-columnFilter
                  type="text"
                  field="razonSocial"
                  display="menu"
                ></p-columnFilter>
                </th>
                <th class="!font-bold !text-center" pSortableColumn="tipoClienteNombre">
                  Entregado por <p-sortIcon field="tipoClienteNombre" />
                  <p-columnFilter type="date" field="tipoClienteNombre" display="menu" />
                </th>
                                <th class="!font-bold !text-center" pSortableColumn="fechaAlta">
                  Entregado el <p-sortIcon field="fechaAlta" />
                  <p-columnFilter type="date" field="fechaAlta" display="menu" />
                </th>

                <th class="!font-bold !text-center">Acciones</th>
              </tr>
            </ng-template>
            <ng-template #body let-item let-i="rowIndex">
              <tr>
                <td class="!text-left">{{ i + 1 }}</td>
                <td class="!text-center">{{ item.base }}</td>
                <td class="!text-center">{{ item.destino }}</td>
                  <td class="!text-center">{{ item.entrego }}</td>
                  <td class="!text-center">{{ item.entregoel | datetime }}</td>
                  <td class="!text-center">{{ item.fechaAlta }}</td>
                <!-- <td class="!text-center">
                  <app-status-binary-read-only [value]="item.status" />
                </td> -->
                <td class="text-center">
                  <div class=" gap-2 ">
                    <p-button
                      icon="fa-solid fa-eye"
                      severity="info"
                      variant="outlined"
                      pTooltip="ver"
                      appendTo="body"
                      tooltipStyleClass="tancol-tooltip"
                      (onClick)="displayUpdate(item.data)"
                    />
                    <!-- <p-button
                      icon="fa-solid fa-trash"
                      severity="danger"
                      variant="outlined"
                      pTooltip="Eliminar"
                      appendTo="body"
                      tooltipStyleClass="tancol-tooltip"
                      (onClick)="displayDelete(item)"
                    /> -->
                  </div>
                </td>
              </tr>
            </ng-template>
          </p-table>
        </div>
      </div>
    </div>
  </div>
  
  <!-- <app-eliminar></app-eliminar> -->
