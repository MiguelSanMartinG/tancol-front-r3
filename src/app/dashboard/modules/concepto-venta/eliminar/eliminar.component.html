<p-dialog
  header="Eliminar concepto de venta"
  [modal]="true"
  [(visible)]="display"
  (onHide)="handleHide()"
  [style]="{ width: '25rem' }"
>
  <form class="pt-5" [formGroup]="formulario" (ngSubmit)="submit()">
    <div class="pt-1">
      <label class="block font-medium">Concepto:</label>
      <input type="text" pInputText class="w-full" formControlName="concepto" />
    </div>
    <div class="pt-1">
      <label class="block font-medium">Nombre:</label>
      <input type="text" pInputText class="w-full" formControlName="name" />
    </div>
    <div class="pt-5">
      <p-button label="Eliminar" type="submit" severity="danger" styleClass="w-full !py-2" />
    </div>
  </form>
</p-dialog>
