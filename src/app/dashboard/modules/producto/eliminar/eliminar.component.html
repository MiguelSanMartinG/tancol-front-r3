<app-dialog-eliminar
  [(visible)]="display"
  title="Eliminar insumo"
  message="¿Seguro que deseas eliminar este registro? Esta acción no se puede deshacer."
  confirmLabel="Eliminar"
  [details]="[{ label: 'Nombre', value: formulario.get('nombre')?.value }, { label: 'SKU', value: formulario.get('sku')?.value }, { label: 'Alias', value: formulario.get('alias')?.value }, { label: 'Descripción', value: formulario.get('descripcion')?.value }]"
  (confirm)="submit()"
  (cancel)="handleHide()"
/>
