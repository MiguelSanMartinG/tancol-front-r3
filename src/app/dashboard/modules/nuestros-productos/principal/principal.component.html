<div class="catalog-page">
  <div class="catalog-heading">
    <app-header label="Productos Tancol"></app-header>
    <app-boton-regresar router="../../" tooltip="Volver a Catálogos" />
  </div>
  <div class="catalog-table">
    <tc-native-table
      storageKey="productos-tancol-v1"
      [columns]="columns"
      [rows]="page.rows()"
      [total]="page.total()"
      [loading]="page.loading()"
      [pageSize]="page.pageSize()"
      [sort]="page.sort()"
      [filters]="page.filters()"
      [selectedIndex]="page.selectedIndex()"
      (sortChange)="page.onSort($event)"
      (filtersChange)="page.onFilters($event)"
      (pageSizeChange)="page.onPageSize($event)"
      (visibleRangeChange)="page.onVisibleRange($event)"
      (selectedIndexChange)="page.selectedIndex.set($event)"
    >
      <div tcNativeTableToolbar>
        <p-button label="Registrar" icon="pi pi-plus" (onClick)="displayCreate()" />
        <p-button label="Limpiar filtros" [outlined]="true" icon="pi pi-filter-slash" (click)="page.clearQuery()" />
        <p-iconfield iconPosition="left">
          <p-inputicon><i class="pi pi-search"></i></p-inputicon>
          <input pInputText type="text" [value]="page.searchDraft" (input)="page.onSearch($any($event.target).value)" placeholder="Búsqueda global" />
        </p-iconfield>
      </div>
      <ng-template tcNativeTableCell="index" let-index="index"><span class="cell-text">{{ index + 1 }}</span></ng-template>
      <ng-template tcNativeTableCell="sku" let-row><span class="cell-text">{{ row.sku }}</span></ng-template>
      <ng-template tcNativeTableCell="nombre" let-row><span class="cell-text">{{ row.nombre }}</span></ng-template>
      <ng-template tcNativeTableCell="alias" let-row><span class="cell-text">{{ row.alias }}</span></ng-template>
      <ng-template tcNativeTableCell="presentacion" let-row><span class="cell-text">{{ presentacion(row) }}</span></ng-template>
      <ng-template tcNativeTableCell="precio" let-row><span class="cell-text">${{ row.precio }}</span></ng-template>
      <ng-template tcNativeTableCell="createdAt" let-row><span class="cell-text">{{ row.createdAt | datetime }}</span></ng-template>
      <ng-template tcNativeTableCell="updatedAt" let-row><span class="cell-text">{{ (row.updatedAt || row.createdAt) | datetime }}</span></ng-template>
      <ng-template tcNativeTableCell="enabled" let-row><app-status-binary-read-only [value]="row.enabled" /></ng-template>
      <ng-template tcNativeTableCell="acciones" let-row>
        <div class="flex gap-2 justify-center">
          <p-button icon="pi pi-percentage" severity="help" variant="outlined" pTooltip="Comisiones" appendTo="body" tooltipStyleClass="tancol-tooltip" (onClick)="displayComisiones(row)" />
          <p-button icon="fa-solid fa-pen" severity="info" variant="outlined" pTooltip="Editar" appendTo="body" tooltipStyleClass="tancol-tooltip" (onClick)="displayUpdate(row)" />
          <p-button icon="fa-solid fa-trash" severity="danger" variant="outlined" pTooltip="Eliminar" appendTo="body" tooltipStyleClass="tancol-tooltip" (onClick)="displayDelete(row)" />
        </div>
      </ng-template>
      <ng-template tcNativeTableEmpty>Sin productos</ng-template>
    </tc-native-table>
  </div>
</div>
<app-registrar-producto (saved)="page.resetAndLoad()"></app-registrar-producto>
<app-editar (saved)="page.resetAndLoad()"></app-editar>
<app-eliminar (deleted)="page.resetAndLoad()"></app-eliminar>
