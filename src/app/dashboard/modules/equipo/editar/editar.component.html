<div>
  <div><app-header label="Equipo - Editar"></app-header></div>
  <form [formGroup]="formulario" class="equipo-form mt-5">
    <section class="equipo-form__image">
      <h3>Imagen del equipo</h3>
      <app-image-picker accept="image/png,image/jpeg,image/webp" hint="PNG, JPG o WEBP · Máximo 5 MB" [existingUrl]="formulario.value.idImagen ? imagenesUrl + formulario.value.idImagen : null" (fileChange)="archivo = $event" (existingRemoved)="formulario.patchValue({ idImagen: '' })" />
    </section>

    <section class="equipo-form__details">
      <div class="equipo-form__title">
        <span aria-hidden="true"><i class="fa-regular fa-file-lines"></i></span>
        <h3>Información general</h3>
      </div>

      <div class="equipo-form__fields">
        <div class="equipo-field equipo-field--full">
          <label for="equipoNombre">Nombre</label>
          <input id="equipoNombre" pInputText formControlName="nombre" placeholder="Ej. PTENFOF108W" />
          <app-message-error [control]="formulario.get('nombre')" />
        </div>
        <div class="equipo-field">
          <label for="equipoSku">SKU</label>
          <input id="equipoSku" pInputText formControlName="sku" placeholder="Ej. 108W" />
        </div>
        <div class="equipo-field">
          <label for="equipoTipo">Tipo de equipo</label>
          <p-select inputId="equipoTipo" [options]="tipos" optionLabel="label" optionValue="value" formControlName="idTipoEquipo" [filter]="true" filterBy="label" filterPlaceholder="Buscar tipo de equipo" emptyFilterMessage="Sin coincidencias" appendTo="body" placeholder="Selecciona" class="w-full" />
          <app-message-error [control]="formulario.get('idTipoEquipo')" />
        </div>
        <div class="equipo-field">
          <label for="equipoMarca">Marca</label>
          <input id="equipoMarca" pInputText formControlName="marca" placeholder="Ej. Imbera" />
        </div>
        <div class="equipo-field">
          <label for="equipoModelo">Modelo</label>
          <input id="equipoModelo" pInputText formControlName="modelo" placeholder="Ej. VR-17" />
        </div>
        <div class="equipo-field equipo-field--full">
          <label for="equipoDescripcion">Descripción</label>
          <textarea id="equipoDescripcion" pTextarea formControlName="descripcion" rows="4" placeholder="Detalles adicionales del equipo"></textarea>
        </div>
      </div>
    </section>
  </form>
  @if (clienteAsignado) {
    <div class="mt-5 rounded-2xl border border-sky-200 bg-sky-50 p-5">
      <h2 class="text-lg font-semibold text-sky-900">Cliente asignado</h2>
      <p class="mt-2"><span class="font-medium">Nombre comercial:</span> {{ clienteAsignado.nombreComercial }}</p>
      <p><span class="font-medium">Tipo de cliente:</span> {{ clienteAsignado.tipoDeCliente?.nombre || '-' }}</p>
    </div>
  }
  <div class="form-actions"><app-boton-cancelar [route]="['../../']" /><p-button [disabled]="formulario.invalid" icon="pi pi-save" styleClass="form-save-button" label="Actualizar" severity="primary" (onClick)="guardar()" /></div>
</div>
