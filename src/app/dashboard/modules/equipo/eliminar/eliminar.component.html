<app-dialog-eliminar
  [(visible)]="display"
  title="Eliminar equipo"
  message="¿Seguro que deseas eliminar este registro? Esta acción no se puede deshacer."
  confirmLabel="Eliminar"
  [details]="[{ label: 'Nombre', value: formulario.get('nombre')?.value }, { label: 'SKU', value: formulario.get('sku')?.value }, { label: 'Estado', value: formulario.get('estado')?.value }]"
  (confirm)="confirmar()"
  (cancel)="cerrar()"
/>
