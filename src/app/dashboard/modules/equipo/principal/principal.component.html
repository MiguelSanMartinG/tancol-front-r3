<div class="equipo-page">
  <div class="equipo-heading">
    <app-header label="Equipos"></app-header>
    <app-boton-regresar router="../../" tooltip="Volver a Catálogos" />
  </div>
  <div class="equipo-table">
    <tc-native-table
      storageKey="equipos-v1"
      [columns]="columns()"
      [rows]="rows()"
      [total]="total()"
      [loading]="loading()"
      [pageSize]="pageSize()"
      [sort]="sort()"
      [filters]="filters()"
      [selectedIndex]="selectedIndex()"
      (sortChange)="onSort($event)"
      (filtersChange)="onFilters($event)"
      (pageSizeChange)="onPageSize($event)"
      (visibleRangeChange)="onVisibleRange($event)"
      (selectedIndexChange)="selectedIndex.set($event)"
    >
      <div tcNativeTableToolbar>
        <p-button label="Registrar" icon="pi pi-plus" (onClick)="crear()" />
        <p-button label="Limpiar filtros" [outlined]="true" icon="pi pi-filter-slash" (click)="clearQuery()" />
        <p-iconfield iconPosition="left">
          <p-inputicon>
            <i class="pi pi-search"></i>
          </p-inputicon>
          <input pInputText type="text" [value]="searchDraft" (input)="onSearch($any($event.target).value)" placeholder="Búsqueda global" />
        </p-iconfield>
      </div>
      <ng-template tcNativeTableCell="index" let-index="index">
        <span class="cell-text">{{ index + 1 }}</span>
      </ng-template>
      <ng-template tcNativeTableCell="nombre" let-row>
        <span class="cell-text">{{ texto(row.nombre) }}</span>
      </ng-template>
      <ng-template tcNativeTableCell="sku" let-row>
        <span class="cell-text">{{ texto(row.sku) }}</span>
      </ng-template>
      <ng-template tcNativeTableCell="marca" let-row>
        <span class="cell-text">{{ texto(row.marca) }}</span>
      </ng-template>
      <ng-template tcNativeTableCell="modelo" let-row>
        <span class="cell-text">{{ texto(row.modelo) }}</span>
      </ng-template>
      <ng-template tcNativeTableCell="idTipoEquipo" let-row>
        <span class="cell-text">{{ texto(row.tipoEquipo?.nombre) }}</span>
      </ng-template>
      <ng-template tcNativeTableCell="estado" let-row>
        <span class="cell-text">{{ estadoLabel(row.estado) }}</span>
      </ng-template>
      <ng-template tcNativeTableCell="cliente" let-row>
        <span class="cell-text">{{ texto(row.clienteAsignado?.nombreComercial) }}</span>
      </ng-template>
      <ng-template tcNativeTableCell="createdAt" let-row>
        <span class="cell-text">{{ row.createdAt | datetime }}</span>
      </ng-template>
      <ng-template tcNativeTableCell="acciones" let-row>
        <div class="flex gap-2 justify-center">
          <p-button
            icon="fa-solid fa-pen"
            severity="info"
            variant="outlined"
            pTooltip="Editar"
            appendTo="body"
            tooltipStyleClass="tancol-tooltip"
            (onClick)="editar(row)"
          />
          <p-button
            icon="fa-solid fa-trash"
            severity="danger"
            variant="outlined"
            pTooltip="Eliminar"
            appendTo="body"
            tooltipStyleClass="tancol-tooltip"
            (onClick)="eliminar(row)"
          />
        </div>
      </ng-template>
      <ng-template tcNativeTableEmpty>Sin equipos</ng-template>
    </tc-native-table>
  </div>
</div>
<app-equipo-eliminar (deleted)="resetAndLoad()"></app-equipo-eliminar>
