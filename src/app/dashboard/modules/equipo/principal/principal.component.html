<div>
  <app-boton-regresar router="../../" />
  <div class="pt-10"><app-header label="Equipos"></app-header></div>
  <div class="mb-5 mt-5"><p-button label="Registrar" styleClass="w-full !py-2" (onClick)="crear()" /></div>
  <div class="grid grid-cols-12 gap-8">
    <div class="col-span-12 mt-5 rounded-2xl bg-white p-5 shadow-md">
      <p-table #table [value]="listaRegistros()" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[5,10,20]" [tableStyle]="{ 'min-width': '80rem' }" [globalFilterFields]="['nombre','sku','marca','modelo','estado','tipoEquipoNombre','clienteAsignadoNombre']">
        <ng-template #caption>
          <div class="flex justify-between gap-4">
            <p-button label="Limpiar filtros" [outlined]="true" icon="pi pi-filter-slash" (onClick)="table.clear()" />
            <p-iconfield iconPosition="left"><p-inputicon><i class="pi pi-search"></i></p-inputicon><input pInputText type="text" placeholder="Búsqueda global" (input)="buscar(table, $event)" /></p-iconfield>
          </div>
        </ng-template>
        <ng-template #header>
          <tr>
            <th class="!font-bold">Nombre</th><th class="!font-bold">SKU</th><th class="!font-bold">Marca</th><th class="!font-bold">Modelo</th><th class="!font-bold">Tipo</th><th class="!font-bold">Estado</th><th class="!font-bold">Cliente asignado</th><th class="!font-bold">Creado</th><th class="!font-bold">Acciones</th>
          </tr>
        </ng-template>
        <ng-template #body let-item>
          <tr>
            <td>{{ item.nombre }}</td><td>{{ item.sku || '-' }}</td><td>{{ item.marca || '-' }}</td><td>{{ item.modelo || '-' }}</td><td>{{ item.tipoEquipo?.nombre || '-' }}</td><td>{{ item.estado }}</td><td>{{ item.clienteAsignadoNombre || '-' }}</td><td>{{ item.createdAtDate | datetime }}</td>
            <td><div class="flex justify-center gap-2"><p-button icon="fa-solid fa-pen" severity="info" variant="outlined" pTooltip="Editar" (onClick)="editar(item)" /><p-button icon="fa-solid fa-trash" severity="danger" variant="outlined" pTooltip="Eliminar" (onClick)="eliminar(item)" /></div></td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>
<app-equipo-eliminar></app-equipo-eliminar>
