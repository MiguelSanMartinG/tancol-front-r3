<app-dialog-eliminar
  [(visible)]="display"
  title="Desactivar empleado"
  message="¿Seguro que deseas desactivar este registro? Dejará de estar disponible en el sistema."
  confirmLabel="Desactivar"
  confirmIcon="pi pi-user-minus"
  [details]="[{ label: 'Nombre', value: formulario.get('nombre')?.value }]"
  (confirm)="submit()"
  (cancel)="handleHide()"
/>
