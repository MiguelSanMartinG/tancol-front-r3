<div>
  <!-- <div>
    <app-boton-regresar router="../principal" />
  </div> -->
  <div>
    <app-header label="Empleado - Crear"></app-header>
  </div>

  <div class="bg-white mt-5 rounded-2xl p-5 form-card">
    <h2 class="text-xl pb-5">Fotografía</h2>
    <div class="mb-6 max-w-xs">
      <app-image-picker
        accept="image/png,image/jpeg,image/webp"
        hint="PNG, JPG o WEBP · Máximo 5 MB · Se usa como foto de perfil"
        [existingUrl]="formulario.value.idImagen ? imagenesUrl + formulario.value.idImagen : null"
        (fileChange)="foto = $event"
        (existingRemoved)="formulario.patchValue({ idImagen: '' })"
      />
    </div>
    <h2 class="text-xl pb-5">Información general</h2>
    <app-form [formulario]="formulario"></app-form>
  </div>

  <div class="form-actions">
    <app-boton-cancelar [route]="['../']" />
    <!-- <p-button label="Borrado" severity="secondary" styleClass="!text-2xl !w-96"  (onClick)="submit('BORRADOR')"></p-button> -->
    <p-button [disabled]="formulario.invalid" icon="pi pi-save" styleClass="form-save-button" label="Guardar" severity="primary" (onClick)="validarRegistros()"></p-button>
  </div>
</div>
