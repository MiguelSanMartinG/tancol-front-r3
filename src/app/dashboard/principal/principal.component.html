<nav class="bg-sky-950 shadow-lg">
    <div class="px-8">
        <div class="flex justify-between items-center h-20">
            <div class="flex">
                <img src="logotipo.png" alt="Logo de la empresa" class="h-14 w-auto">
            </div>
            <div class="text-center">
                <div>
                    <!-- <p class="text-gray-200 font-semibold text-xl">Nombre del Departamento</p> -->
                </div>
            </div>
            <div class="flex items-center gap-4">
                <a
                    routerLink="/dashboard/principal/dashboard-reportes"
                    class="relative flex h-11 w-11 items-center justify-center rounded-full text-white hover:bg-white/10"
                    aria-label="Dashboard de indicadores"
                    title="Dashboard de indicadores"
                >
                    <i class="pi pi-chart-line text-xl"></i>
                </a>
                <details *ngIf="puedeVerNotificaciones" class="notifications-dropdown relative">
                    <summary class="relative flex h-11 w-11 cursor-pointer list-none items-center justify-center rounded-full text-white hover:bg-white/10" aria-label="Notificaciones">
                        <i class="pi pi-bell text-xl"></i>
                        <span *ngIf="noLeidas()" class="absolute -right-1 -top-1 flex min-h-5 min-w-5 items-center justify-center rounded-full bg-red-500 px-1 text-xs font-bold text-white">
                            {{ noLeidas() > 99 ? '99+' : noLeidas() }}
                        </span>
                    </summary>
                    <div class="absolute right-0 z-50 mt-2 w-80 overflow-hidden rounded-xl bg-white text-slate-800 shadow-xl sm:w-96">
                        <div class="border-b px-4 py-3 font-semibold">Notificaciones</div>
                        <div class="max-h-96 overflow-y-auto">
                            <div
                                *ngFor="let item of pendientes()"
                                class="block w-full border-b px-4 py-3 text-left hover:bg-slate-50"
                                [class.bg-sky-50]="!item.leida"
                            >
                                <span class="flex items-start gap-2">
                                    <span *ngIf="!item.leida" class="mt-2 h-2 w-2 shrink-0 rounded-full bg-sky-600"></span>
                                    <span [class.ml-4]="item.leida">
                                        <strong class="block text-sm">{{ item.titulo }}</strong>
                                        <span class="mt-1 block text-sm text-slate-600">{{ item.mensaje }}</span>
                                        <span class="mt-1 block text-xs text-slate-400">{{ item.createdAt | date:'dd/MM/yyyy HH:mm' }}</span>
                                        <span class="mt-3 flex items-center gap-2">
                                            <a
                                                routerLink="/dashboard/principal/notificaciones"
                                                class="inline-flex items-center gap-1 rounded-md border border-sky-700 px-2 py-1 text-xs font-semibold text-sky-700 hover:bg-sky-100"
                                            >
                                                <i class="pi pi-eye"></i>
                                                Ver
                                            </a>
                                            <button
                                                *ngIf="!item.leida"
                                                type="button"
                                                class="inline-flex h-7 w-7 items-center justify-center rounded-md bg-sky-700 text-white hover:bg-sky-800"
                                                aria-label="Marcar como leída"
                                                title="Marcar como leída"
                                                (click)="marcarComoLeida(item)"
                                            >
                                                <span aria-hidden="true" class="text-base font-bold leading-none">✓</span>
                                            </button>
                                        </span>
                                    </span>
                                </span>
                            </div>
                            <p *ngIf="pendientes().length === 0" class="px-4 py-8 text-center text-sm text-slate-500">No tienes notificaciones pendientes.</p>
                        </div>
                    </div>
                </details>
                <div class="mr-4">
                    <img src="default-profile.png" alt="Foto de perfil" class="h-12 w-12 rounded-full border-2 border-white">
                </div>
                <div>
                    <p class="text-gray-200 font-semibold">{{localStorage.getUserInfo()?.nombre}}</p>
                    <a href="#" class="text-gray-200 hover:underline">Cerrar Sesión</a>
                </div>
            </div>
        </div>
    </div>
</nav>
<div class="dashboard-content p-5 pt-6">
    <router-outlet></router-outlet>
</div>
